# Règles des comptes futures 50k — Apex Trader Funding, Tradeify, Lucid Trading
# Relevé du 16/10/2026 (agent « Règles des propfirms »). Détail, citations et contradictions : REGLES.md
#
# CONVENTIONS (clés du schéma imposé + clés ajoutées, aucune clé du schéma n'est renommée)
# - Toutes les heures sont en heure de Chicago (CT). ET = CT + 1 h.
# - drawdown_type             : type de drawdown pendant l'ÉVAL (ou du compte financé s'il n'y a pas d'éval).
#   drawdown_type_funded      : type pendant la phase financée (ajouté ; souvent identique).
# - drawdown_plafond_usd      : NIVEAU DU PLANCHER (seuil de liquidation) une fois que le trailing s'arrête,
#                               en phase FINANCÉE (ex. 50100). 0 = sans objet.
#   drawdown_declencheur_blocage_usd : solde (de clôture si EOD, pic intraday si intraday) qui déclenche ce blocage.
#   drawdown_plafond_eval_usd : plancher maximal atteint pendant l'éval (0 = le trailing ne s'arrête jamais en éval ;
#                               sans effet pratique si l'éval est réussie avant).
#   drawdown_bloque_a_la_demande_payout : true si une demande de payout fige immédiatement le plancher.
# - perte_journaliere_usd     : DLL de l'ÉVAL (ou du financé s'il n'y a pas d'éval). perte_journaliere_funded_usd : DLL
#                               de départ en financé. perte_journaliere_funded_regle : évolution éventuelle.
# - contrats_max_mini/micro   : limite en ÉVAL. contrats_funded_paliers = [[profit_min_usd, minis], ...] (micros = 10 x minis).
# - jours_min_eval            : minimum de jours pour réussir (y compris celui imposé de fait par la règle de constance).
# - consistance_*_pct         : plus gros jour / profit total, en % (0 = aucune).
# - payout_plafonds_usd       : plafond par demande, payout n°1, n°2, ... ; le dernier s'applique aux suivants
#                               sauf si payouts_max l'interdit. payout_pct_profit_max : part max du profit retirable (0 = sans).
#   payout_solde_min_usd      : solde minimal pour demander (0 = aucun). payout_profit_cycle_min_usd : profit minimal du cycle.
# - duree_max_eval_jours      : 0 = illimité.
# - frais_* en USD, PRIX CATALOGUE (hors codes promo, qui sont fréquents) ; -1 = introuvable de source officielle.
# - Une valeur « a_verifier » dans la clé `incertitudes` signale un point non confirmé par une source officielle.


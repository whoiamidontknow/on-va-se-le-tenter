# ============================================================================
# RÈGLES PROPFIRM — PROVISOIRE (16/10/2026)
# ============================================================================
# PROVISOIRE : estimations de mémoire du simulateur, NON vérifiées sur les sites.
# Le fichier de référence est `regles.toml` (écrit par l'agent « Règles propfirms ») :
# simulateur.py le lit EN PRIORITÉ s'il existe et n'utilise ce fichier qu'à défaut.
#
# Conventions (les mêmes que regles.toml) :
#   - montants en USD ; drawdown_plafond_usd = niveau maximal du seuil de liquidation
#     AU-DESSUS du capital (100 -> le seuil cesse de monter à 50 100 $). Une valeur
#     > capital/2 est lue comme un solde absolu (50100 -> 100) ; 0 = pas de plafond.
#   - REMPLACÉ le 16/10 par regles.toml (définitif) : ce fichier ne sert plus que de secours.
#   - perte_journaliere_type : "soft" (arrêt du jour), "hard" (échec), "none".
#   - consistance_*_pct : meilleure journée <= pct % du gain total (0 = pas de règle).
#   - Champs facultatifs propres au simulateur (absents du schéma commun) :
#       propfirm, jours_gagnants_min_payout, coussin_payout_usd, payout_max_usd,
#       partage_pct, frais_eval_mensuels, frais_activation_mensuels.
# ============================================================================

